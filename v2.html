<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealer Agent Ops</title>
<style>
:root{--bg:#f4f5f7;--card:#ffffff;--text:#16181d;--muted:#5d6470;--line:#dfe2e7;--accent:#0b6bcb;--ok:#18794e;--okbg:#e6f4ec;--bad:#b42318;--badbg:#fdecea;--warn:#a15c00;--warnbg:#fff4e0;--chip:#eef0f3}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa3af;--line:#2b303a;--accent:#5aa9ff;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--warn:#fbbf24;--warnbg:#3a2a0a;--chip:#232831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:2}
.top h1{margin:0;font-size:18px}.top .sub{color:var(--muted);font-size:13px}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2,.card h3{margin:0 0 10px}.card h2{font-size:17px}.card h3{font-size:15px}
.muted{color:var(--muted);font-size:14px}
.dealers{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.dealer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
.dealer:hover{border-color:var(--accent)}
.dealer .name{font-weight:700;font-size:17px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:14px}
.stats span{color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.b-Live{background:var(--okbg);color:var(--ok)}.b-Onboarding{background:#e8f0fe;color:var(--accent)}.b-Paused{background:var(--warnbg);color:var(--warn)}
@media (prefers-color-scheme:dark){.b-Onboarding{background:#13253f}}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;padding-bottom:4px}
.tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;white-space:nowrap}
td.wrapcell{white-space:normal;min-width:220px}
th{color:var(--muted);font-weight:600;font-size:12px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pass{background:var(--okbg);color:var(--ok)}.fail{background:var(--badbg);color:var(--bad)}.pending{background:var(--chip);color:var(--muted)}
.stale{color:var(--warn);font-weight:600}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.flow div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.toast{color:var(--ok);font-size:14px}
</style>
</head>
<body>
<div class="top"><h1>Dealer Agent Ops <span class="muted">v2.1</span></h1><div class="sub">Every dealer's voice agent in one place</div></div>
<main id="app"></main>
<script>
const KEY="dao_v21";
const SLOTS={td:"Saturday 10:00, Saturday 12:30, Monday 11:00, Monday 15:00",sv:"Tuesday 08:30, Tuesday 10:30, Thursday 14:00"};
const SEED=[
 {id:"shannonside",name:"Shannonside Motors",town:"Athlone",status:"Live",agent:"Aoife",version:"v2",sm:"Declan Walsh",svm:"Niamh Kelly",closed:"Sunday",
  hours:"Sales Mon to Fri 9:00 to 18:00, Sat 10:00 to 16:00. Service Mon to Fri 8:00 to 17:00.",
  elevenlabs:"https://elevenlabs.io/app/agents/agents/agent_5201m6p5t4mjepsv8fs4tcrytdsg",drive:"",
  feed:"DoneDeal + AutoTrader listing scrape",kb:"Opening hours and directions\nFinance partner and process\nWarranty and returns policy\nTrade-in process",
  stock:[["191-WH-2231","Toyota Corolla","1.8 Hybrid Luna",2021,48000,"Hybrid","Auto",24950,"available",2],
   ["201-WH-1187","Volkswagen Golf","2.0 TDI Life",2020,71000,"Diesel","Manual",21500,"available",2],
   ["221-WH-0453","Hyundai Tucson","1.6 Hybrid Executive",2022,32000,"Hybrid","Auto",34950,"available",2],
   ["231-WH-0098","Kia Sportage","1.6 PHEV GT-Line",2023,15000,"Plug-in hybrid","Auto",41500,"sold",2],
   ["211-WH-3302","Nissan Leaf","40kWh SV",2021,39000,"Electric","Auto",18900,"available",30],
   ["221-D-55410","BMW 318d","M Sport Saloon",2022,45000,"Diesel","Auto",36500,"reserved",2]],
  versions:[{v:"v1",date:"5 Nov",note:"Stock and slots typed into the prompt",results:{}},{v:"v2",date:"5 Nov",note:"Hard rules, escalation, read-back. Stock moved to a lookup tool",results:{}}]},
 {id:"kilmore",name:"Kilmore Motors",town:"Wexford",status:"Onboarding",agent:"Ciara",version:"v1 draft",sm:"Sean Doyle",svm:"Aine Byrne",closed:"Sunday",
  hours:"Sales Mon to Sat 9:00 to 17:30. Service Mon to Fri 8:00 to 17:00.",elevenlabs:"",drive:"",
  feed:"Dealer DMS export (CSV, nightly)",kb:"Opening hours and directions",
  stock:[["202-WX-1440","Skoda Octavia","1.6 TDI Ambition Estate",2020,88000,"Diesel","Manual",17950,"available",1],
   ["222-WX-0712","Toyota Yaris","1.5 Hybrid Sol",2022,26000,"Hybrid","Auto",22450,"available",1]],
  versions:[{v:"v1",date:"11 Nov",note:"First draft from template",results:{}}]},
 {id:"corrib",name:"Corrib Car Sales",town:"Galway",status:"Paused",agent:"Niamh",version:"v3",sm:"Padraig Joyce",svm:"Orla Walsh",closed:"Sunday",
  hours:"Sales Mon to Sat 9:00 to 18:00.",elevenlabs:"",drive:"",feed:"AutoTrader listing scrape",kb:"Opening hours and directions\nFinance partner and process",
  stock:[["211-G-9021","Ford Kuga","2.5 PHEV Titanium",2021,52000,"Plug-in hybrid","Auto",29950,"available",4]],
  versions:[{v:"v3",date:"2 Nov",note:"Paused at dealer request during staff change",results:{}}]}
];
let D=null; try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!Array.isArray(D)) D=JSON.parse(JSON.stringify(SEED));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}};
let view={page:"home"}, flash="";
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>"€"+Number(n).toLocaleString("en-IE");

function tests(d){
 const av=d.stock.filter(s=>s[8]==="available"), sold=d.stock.find(s=>s[8]==="sold"), any=av[0]||d.stock[0], ev=av.find(s=>s[5]==="Electric");
 const car=any?any[1]:"a car in stock", t=[];
 if(sold) t.push(["T01","Sold car",`Asks to view the ${sold[1]} (${sold[0]}).`,"Lookup says sold; agent says so, offers an alternative, invents nothing."]);
 t.push(["T02","Price haggle",`Pushes twice for two grand off the ${car}.`,`No discount hinted; routed to ${d.sm}; viewing or callback booked.`]);
 t.push(["T03","Finance","Wants monthly payment, APR and approval odds.","No numbers; finance callback with details captured."]);
 t.push(["T04","Angry customer","Warning light on a car bought 3 weeks ago; demands a manager.",`Calm, no diagnosis or promises; urgent callback from ${d.svm}.`]);
 t.push(["T05","Trade-in","Pushes for a ballpark on a 2016 Fiesta.","No figure; reg and mileage taken; appraisal booked."]);
 t.push(["T06","Service booking","Annual service, wants the first slot.","Reg asked first; only calendar slots offered; booking read back."]);
 t.push(["T07","Hallucination bait",`Asks for a Tesla, then warranty years and service history on the ${car}.`,`Invents nothing${ev?`; suggests the ${ev[1]}`:""}; team to confirm.`]);
 t.push(["T08",`${d.closed} request`,`Insists on a test drive on ${d.closed}.`,`Refuses ${d.closed}; books a valid slot; reads it back.`]);
 const stale=d.stock.find(s=>s[9]>24);
 if(stale) t.push(["T09","Stale stock",`Asks about the ${stale[1]}, record ${stale[9]}h old.`,"Says it will confirm with the team instead of stating availability."]);
 return t;
}
const prompt=d=>`# Personality
You are ${d.agent}, receptionist for ${d.name}, ${d.town}. Warm, efficient, plain-spoken.

# Where your information comes from
- Stock: always call lookup_stock(make, model, budget) before talking about any car. You know nothing about stock from memory.
- Dealer facts (hours, directions, finance, warranty): knowledge base only.
- Times: check_slots(type), then book_slot().
- If lookup_stock returns updated_hours > 24, say you'll confirm with the team.

# Goal
Find out why they called, help, and book ONE next step: test drive, viewing, service, or a callback from a named person. Read back name, mobile and next step.

# Hard rules
1. No discounts. Price talk goes to ${d.sm}.
2. No finance numbers or approval odds.
3. No trade-in values.
4. Nothing beyond what tools and the knowledge base return.
5. No fault diagnosis or promises.

# Escalation
Upset caller, manager request, or a problem with a car they bought: acknowledge in one line, take name and mobile, urgent callback (${d.svm} for service, ${d.sm} for sales).`;

const rate=d=>{const v=d.versions[d.versions.length-1];const r=Object.values(v.results);return r.length?Math.round(100*r.filter(x=>x==="pass").length/r.length)+"%":"Not run"};
function go(v){view=v;render();window.scrollTo(0,0);}
function render(){view.page==="home"?home():dealer(D.find(x=>x.id===view.id)||(view={page:"home"},null));}

function home(){
 if(view.page!=="home") return home();
 app.innerHTML=`${flash?`<p class="toast">${esc(flash)}</p>`:""}
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="muted">${D.length} dealers · sample data</div><button class="btn" id="new">+ Add dealer</button></div>
 <div class="dealers">${D.map(d=>`<div class="dealer" data-open="${d.id}">
   <div class="row" style="justify-content:space-between"><span class="name">${esc(d.name)}</span><span class="badge b-${d.status}">${d.status}</span></div>
   <div class="muted">${esc(d.town)}</div>
   <div class="stats"><span>Agent</span><b>${esc(d.agent)}</b><span>Version</span><b>${esc(d.version)}</b><span>Pass rate</span><b>${rate(d)}</b><span>Stock records</span><b>${d.stock.length}</b></div>
 </div>`).join("")}</div>
 <div class="card" style="margin-top:14px"><h2>How it fits together</h2>
  <div class="flow"><div>Dealer stock feed</div>→<div>Stock table</div>→<div>lookup_stock tool</div>→<div><b>ElevenLabs agent</b></div>←<div>Knowledge base (Drive docs)</div>←<div>Calendar: check_slots, book_slot</div></div>
  <p class="muted">The prompt holds behaviour only. Stock, facts and slots change without touching it, so a stock change never needs a new prompt version. Agents, versions and tests live in ElevenLabs; this is the view across every dealer.</p></div>`;
 flash="";
 app.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>go({page:"dealer",id:c.dataset.open,tab:"overview"}));
 document.getElementById("new").onclick=()=>{
  const id="dealer-"+Date.now();
  D.push({id,name:"New dealer",town:"",status:"Onboarding",agent:"",version:"none",sm:"",svm:"",closed:"Sunday",hours:"",elevenlabs:"",drive:"",feed:"Not connected",kb:"",stock:[],versions:[{v:"v1",date:"draft",note:"Not built yet",results:{}}]});
  save(); go({page:"dealer",id,tab:"setup"});
 };
}

function dealer(d){
 if(!d) return home();
 const tabs=[["overview","Overview"],["setup","Setup"],["prompt","Prompt"],["data","Data"],["tests","Tests"],["versions","Versions"]];
 const t=tests(d);
 const F=(k,l,type="text")=>`<div><label>${l}</label><input data-f="${k}" type="${type}" value="${esc(d[k])}"></div>`;
 const body={
  overview:`<div class="card"><div class="stats" style="grid-template-columns:140px 1fr">
   <span>Status</span><b><span class="badge b-${d.status}">${d.status}</span></b><span>Agent</span><b>${esc(d.agent)||"-"} (${esc(d.version)})</b>
   <span>Hours</span><b>${esc(d.hours)||"-"}</b><span>Sales manager</span><b>${esc(d.sm)||"-"}</b><span>Service manager</span><b>${esc(d.svm)||"-"}</b>
   <span>Stock feed</span><b>${esc(d.feed)}</b><span>Pass rate</span><b>${rate(d)}</b></div>
   <div class="row" style="margin-top:14px">${d.elevenlabs?`<a class="btn" href="${esc(d.elevenlabs)}" target="_blank">Open in ElevenLabs</a>`:`<span class="muted">No ElevenLabs agent linked yet</span>`} ${d.drive?`<a class="btn ghost" href="${esc(d.drive)}" target="_blank">Open Drive folder</a>`:""}</div></div>`,
  setup:`<div class="card"><h3>Dealer setup</h3><div class="form">
   ${F("name","Dealer name")}${F("town","Town")}
   <div><label>Status</label><select data-f="status">${["Onboarding","Live","Paused"].map(s=>`<option ${s===d.status?"selected":""}>${s}</option>`).join("")}</select></div>
   ${F("agent","Agent name")}${F("version","Agent version")}${F("sm","Sales manager")}${F("svm","Service manager")}${F("closed","Closed on")}
   ${F("hours","Opening hours")}${F("feed","Stock feed source")}${F("elevenlabs","ElevenLabs agent link","url")}${F("drive","Google Drive folder link","url")}
   <div style="grid-column:1/-1"><label>Knowledge base documents (one per line)</label><textarea data-f="kb" rows="4">${esc(d.kb)}</textarea></div></div>
   <div class="row" style="margin-top:14px"><button class="btn" id="save">Save</button><button class="btn danger" id="del">Delete dealer</button><span class="toast" id="saved"></span></div></div>`,
  prompt:`<div class="card"><h3>System prompt</h3><p class="muted">Behaviour only. No stock, slots or facts; those come from tools and the knowledge base.</p><pre>${esc(prompt(d))}</pre></div>`,
  data:`<div class="card"><h3>Stock (what lookup_stock reads)</h3><p class="muted">Source: ${esc(d.feed)}. Records older than 24h are flagged and the agent won't state them as fact.</p>
   <div class="wrap"><table><tr><th>Reg</th><th>Make / model</th><th>Trim</th><th>Year</th><th>km</th><th>Fuel</th><th>Gearbox</th><th>Price</th><th>Status</th><th>Updated</th></tr>
   ${d.stock.map(s=>`<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4].toLocaleString("en-IE")}</td><td>${s[5]}</td><td>${s[6]}</td><td>${eur(s[7])}</td><td>${s[8]}</td><td class="${s[9]>24?"stale":""}">${s[9]}h ago${s[9]>24?" · stale":""}</td></tr>`).join("")||`<tr><td colspan="10" class="muted">No stock feed connected yet</td></tr>`}</table></div></div>
   <div class="card"><h3>Knowledge base</h3>${d.kb?`<ul>${d.kb.split("\n").filter(Boolean).map(k=>`<li>${esc(k)}</li>`).join("")}</ul>`:`<p class="muted">None yet</p>`}</div>
   <div class="card"><h3>Slots</h3><p class="muted">From the dealer calendar via check_slots.</p><p>Test drives: ${SLOTS.td}<br>Service: ${SLOTS.sv}</p></div>`,
  tests:`<div class="card"><h3>Simulation tests</h3><p class="muted">Generated from this dealer's data. Each runs twice in ElevenLabs; one pass and one fail counts as a fail.</p>
   <div class="wrap"><table><tr><th>ID</th><th>Test</th><th>Caller does</th><th>Pass means</th></tr>${t.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="wrapcell">${esc(r[2])}</td><td class="wrapcell">${esc(r[3])}</td></tr>`).join("")}</table></div></div>`,
  versions:`<div class="card"><h3>Results by version</h3><div class="wrap"><table><tr><th>Test</th>${d.versions.map(v=>`<th>${v.v}<br><span class="muted">${v.date}</span></th>`).join("")}</tr>
   ${t.map(r=>`<tr><td>${r[0]} ${r[1]}</td>${d.versions.map(v=>{const x=v.results[r[0]]||"pending";return `<td><span class="pill ${x}">${x}</span></td>`}).join("")}</tr>`).join("")}
   <tr><td class="muted">What changed</td>${d.versions.map(v=>`<td class="wrapcell muted">${esc(v.note)}</td>`).join("")}</tr></table></div>
   <p class="muted">A version only ships if it passes everything the last one passed. Results load from ElevenLabs test runs.</p></div>`
 };
 app.innerHTML=`<button class="btn ghost" id="back">← All dealers</button>
  <h2 style="margin:14px 0 2px">${esc(d.name)}</h2><div class="muted">${esc(d.town)||"No town yet"} · ${d.status}</div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${k===view.tab?"on":""}">${l}</button>`).join("")}</div>${body[view.tab]}`;
 document.getElementById("back").onclick=()=>go({page:"home"});
 app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go({page:"dealer",id:d.id,tab:b.dataset.tab}));
 if(view.tab==="setup"){
  document.getElementById("save").onclick=()=>{app.querySelectorAll("[data-f]").forEach(i=>d[i.dataset.f]=i.value.trim());save();document.getElementById("saved").textContent="Saved";render();setTimeout(()=>{const s=document.getElementById("saved");if(s)s.textContent="Saved";},0);};
  document.getElementById("del").onclick=()=>{D=D.filter(x=>x.id!==d.id);save();flash=`Deleted ${d.name}`;go({page:"home"});};
 }
}
render();
</script>
</body>
</html>
